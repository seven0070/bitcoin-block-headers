name: attach-db-to-release
on:
  push:
    paths: ['.github/workflows/attach-db.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download database zip from mirror
        run: |
          curl -fL --retry 5 -o bitcoin_block_headers.zip https://btc-block-headers.sites.tab.bot/bitcoin_block_headers.zip
          echo "c836592ca2f498afc42b25fb672dc01abf54abdab4f12f2f881db1c47f7840bb  bitcoin_block_headers.zip" | sha256sum -c -
      - name: Upload as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v1.0 bitcoin_block_headers.zip --clobber --repo ${{ github.repository }}
